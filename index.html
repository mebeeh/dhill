<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}.live-src { margin: 0; }
.count b, .count span { color: var(--st-ink, var(--st)); }
.btn.replay { font-size: .85rem; padding: 6px 12px; }
.notice.ahead { background: var(--warn-soft); color: var(--warn-ink); }
.pt-head .pill + .pill { margin-inline-start: 4px; }
</style>
<title>Dhill Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one app column (header · demo strip · tabs · view), widening to two columns for Today on desktop. Shade-blue ground, sun-amber only for heat. */
:root {
  --bg: #F2F6F7; --surface: #FFFFFF; --surface-2: #E6EFF1; --ink: #0D1D22; --muted: #566B71; --line: #D2DFE2;
  --accent: #00778A; --accent-ink: #FFFFFF; --accent-soft: #D9EEF1;
  --sun: #C56A00; --ok: #17865A; --warn: #B86E00; --bad: #C9372F; --emerg: #8A1240;
  --ok-soft: #DDF3E9; --warn-soft: #FBEBD3; --bad-soft: #F9DEDC; --emerg-soft: #F3D9E3; --pend-soft: #E9EEF0;
  --sun-ink: #8F4E00; --ok-ink: #127047; --warn-ink: #8F4E00; --bad-ink: #A82A23; --emerg-ink: #8A1240; --muted-ink: #4F6369;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08141A; --surface: #0E1F26; --surface-2: #142A32; --ink: #E6F2F4; --muted: #94ABB1; --line: #21383F;
  --accent: #2FD5EC; --accent-ink: #04161B; --accent-soft: #0F3540;
  --sun: #FFB547; --ok: #3DDC97; --warn: #FFB547; --bad: #FF6B63; --emerg: #FF7AA8;
  --ok-soft: #0F3326; --warn-soft: #3A2A0D; --bad-soft: #3D1614; --emerg-soft: #3B1426; --pend-soft: #1A2C33;
  --sun-ink: #FFB547; --ok-ink: #3DDC97; --warn-ink: #FFB547; --bad-ink: #FF6B63; --emerg-ink: #FF7AA8; --muted-ink: #94ABB1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #08141A; --surface: #0E1F26; --surface-2: #142A32; --ink: #E6F2F4; --muted: #94ABB1; --line: #21383F;
  --accent: #2FD5EC; --accent-ink: #04161B; --accent-soft: #0F3540;
  --sun: #FFB547; --ok: #3DDC97; --warn: #FFB547; --bad: #FF6B63; --emerg: #FF7AA8;
  --ok-soft: #0F3326; --warn-soft: #3A2A0D; --bad-soft: #3D1614; --emerg-soft: #3B1426; --pend-soft: #1A2C33;
  --sun-ink: #FFB547; --ok-ink: #3DDC97; --warn-ink: #FFB547; --bad-ink: #FF6B63; --emerg-ink: #FF7AA8; --muted-ink: #94ABB1;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-inline-end: auto; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
.brand-tag { color: var(--muted); font-size: .8rem; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .85rem; }

/* demo strip */
.demo { margin-top: 14px; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--surface); }
.demo-label { font-size: .75rem; font-weight: 700; letter-spacing: .04em; color: var(--sun-ink); background: var(--warn-soft); padding: 2px 10px; border-radius: 999px; }
.field { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.field select, .field input[type=number] { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; color: var(--ink); }
.field input[type=range] { accent-color: var(--sun); width: 150px; }
.temp-out { font-weight: 700; color: var(--ink); min-width: 3.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* tabs */
.tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.view { margin-top: 18px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1.15fr 1fr; } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }

/* status */
.status { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.ring { width: 132px; height: 132px; border-radius: 50%; border: 10px solid var(--st); background: var(--st-soft); display: grid; place-items: center; flex: none; }
.ring b { font-family: var(--display); font-size: 1.5rem; color: var(--st-ink, var(--st)); }
.st-green { --st-ink: var(--ok-ink); --st: var(--ok); --st-soft: var(--ok-soft); }
.st-amber { --st-ink: var(--warn-ink); --st: var(--warn); --st-soft: var(--warn-soft); }
.st-red { --st-ink: var(--bad-ink); --st: var(--bad); --st-soft: var(--bad-soft); }
.st-emergency { --st-ink: var(--emerg-ink); --st: var(--emerg); --st-soft: var(--emerg-soft); }
.st-pending { --st-ink: var(--muted-ink); --st: var(--muted); --st-soft: var(--pend-soft); }
.headline { font-family: var(--display); font-size: 1.45rem; font-weight: 700; }
.who { color: var(--muted); font-size: .9rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--st-soft); color: var(--st-ink, var(--st)); }
.actions { margin: 0; padding-inline-start: 1.1em; display: grid; gap: 6px; }
.notice { border-radius: 10px; padding: 10px 12px; background: var(--st-soft); color: var(--ink); font-weight: 600; font-size: .9rem; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reasons li { display: flex; gap: 10px; align-items: flex-start; }
.reasons .dot { margin-top: .55em; background: var(--accent); }

/* forecast */
.fc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fc-day { border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.fc-temp { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
.lv0 { --st-ink: var(--ok-ink); --st: var(--ok); --st-soft: var(--ok-soft); }
.lv1 { --st-ink: var(--warn-ink); --st: var(--warn); --st-soft: var(--warn-soft); }
.lv2 { --st-ink: var(--sun-ink); --st: var(--sun); --st-soft: var(--warn-soft); }
.lv3 { --st-ink: var(--bad-ink); --st: var(--bad); --st-soft: var(--bad-soft); }
.fc-day.today { outline: 2px solid var(--st); }

/* meds */
.med { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.med:first-child { border-top: 0; }
.med-main { flex: 1; min-width: 0; }
.med-name { font-weight: 700; }
.risk-H { --st-ink: var(--bad-ink); --st: var(--bad); --st-soft: var(--bad-soft); }
.risk-M { --st-ink: var(--warn-ink); --st: var(--warn); --st-soft: var(--warn-soft); }
.risk-L { --st-ink: var(--ok-ink); --st: var(--ok); --st-soft: var(--ok-soft); }
.x { border: 1px solid var(--line); background: var(--surface); width: 30px; height: 30px; border-radius: 50%; line-height: 1; color: var(--muted); flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 18px; border-radius: 12px; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* check form */
form.check { display: grid; gap: 14px; }
.toggles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.tog { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); font-weight: 600; }
.tog input { width: 20px; height: 20px; accent-color: var(--accent); }
.tog.warn-tog { border-color: var(--emerg); }
.bp { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.bp .field input { width: 5.2em; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; }
legend { padding-inline: 6px; font-weight: 700; font-size: .9rem; }

/* board */
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { border-radius: 12px; padding: 8px 14px; background: var(--st-soft); min-width: 92px; }
.count b { display: block; font-size: 1.5rem; color: var(--st); line-height: 1.1; }
.pt { display: grid; gap: 10px; border-inline-start: 0; }
.pt-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pt-name { font-weight: 700; font-size: 1.05rem; }
.pt-cols { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .pt-cols { grid-template-columns: 1fr 1fr; } }
.rev { margin: 0; padding-inline-start: 1.1em; display: grid; gap: 4px; }
.called { color: var(--ok); font-weight: 700; }
.board-list { display: grid; gap: 12px; }
.pt.card { box-shadow: inset 0 0 0 0 transparent; }
.pt.card.prio { border-color: var(--st); }

/* how */
.how { display: grid; gap: 16px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tbl { overflow-x: auto; }
.foot { margin-top: 28px; color: var(--muted); font-size: .8rem; text-align: center; }
.toast { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .ring { transition: border-color .25s, background .25s; } }
</style>

</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap">
  <section class="demo" id="demo" aria-label="Demo controls"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <section class="view" id="view"></section>
  <p class="foot" id="foot"></p>
</main>
<div class="toast" id="toast" hidden></div>

  function medProfile(meds) {

    if (c.lessUrine) { signs += 1; reasons.push({ k: 'lessUrine' }); }
    if (c.fever) { signs += 1; reasons.push({ k: 'fever' }); }

    const RANK = { green: 0, amber: 1, red: 2, emergency: 3 }; const NAME = ['green', 'amber', 'red', 'emergency'];
    let floor = 0;
    const orth = reasons.some((r) => r.k === 'orthostatic'); const tachy = reasons.some((r) => r.k === 'tachy');
    if (signs > 0) floor = Math.max(floor, 1);                                   // any abnormal home-check answer
    if (mp.level >= 1 && tempToday >= 38) { floor = Math.max(floor, 1); if (heat === 0) reasons.push({ k: 'hotDay', t: tempToday }); }
    if (c.vomDia || orth || tachy || c.fever) floor = Math.max(floor, 2);        // urgent-contact signs (Watson 2022)
    if (lossPct >= 3) floor = Math.max(floor, 2);                                // weight 3% or more below usual
    // v1.3: a dangerous mix is red on hot days (38 °C or more, or the city's hot level) or with any abnormal answer; otherwise amber
    if (mp.combo && !patient.comboReviewed) {   // until the pharmacist has reviewed the mix once

      floor = Math.max(floor, OPT.comboHot ? ((hot || signs > 0) ? 2 : 1) : 2);
      if (OPT.comboHot && RANK[status] < 2 && floor === 1) reasons.push({ k: 'comboReview' });
    }

    if (OPT.heatRed && heat >= 2 && (mp.level >= 2 || (mp.level >= 1 && signs > 0))) { floor = Math.max(floor, 2); reasons.push({ k: 'veryHotDay', t: tempToday, lvl: heat }); }

    if (RANK[status] < floor) status = NAME[floor];
    return { status, heat, mp, signs, total, reasons, highDay: false };
  }

  const fcTemps = () => { const f = baseFc().slice(); f[0] = state.temp; return f; };
  function fetchLive(city) {
    const c = CITIES[city];
    try { const k = JSON.parse(localStorage.getItem('dhill-fc-' + city) || 'null'); if (k && Date.now() - k.t < 3600e3) { state.live[city] = k.v; state.liveAt[city] = k.at; if (city === state.city && !state.userTemp && !state.replay) state.temp = k.v[0]; if (city === state.city) render(); return; } } catch (e) {}
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon + '&daily=temperature_2m_max&forecast_days=3&timezone=Asia%2FRiyadh';
    fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
      const v = d.daily.temperature_2m_max.slice(0, 3).map((x) => Math.round(x));

    } else if (E.outlook(p, fcTemps()).preCall) {
      const o = E.outlook(p, fcTemps()); lines.push(l.revPre(l.days[o.aheadDay]));
      p.meds.forEach((m) => { const c = cinfo(m); const txt = state.lang === 'ar' ? c.revAr : c.revEn; if (txt && c.risk === 'H') lines.push('<b>' + mname(m) + ':</b> ' + txt); });
    } else if (a.status === 'amber') { lines.push(l.revAmber); if (a.mp.triple) lines.push(l.revTriple); }
    else if (a.status === 'pending') lines.push(l.revPending);
    else lines.push(l.revGreen);
    return lines;
  }

  function viewBoard() {
    const l = L();
    const rows = state.patients.map((p) => ({ p, a: E.assess(p, state.temp), o: E.outlook(p, fcTemps()) })).sort((x, y) => ORDER[x.a.status] - ORDER[y.a.status] || (y.o.preCall - x.o.preCall) || y.a.total - x.a.total);
    const cnt = {}; rows.forEach((r) => { cnt[r.a.status] = (cnt[r.a.status] || 0) + 1; });
    const shown = state.filter === 'need' ? rows.filter((r) => ORDER[r.a.status] <= 1 || r.a.status === 'pending' || r.o.preCall) : rows;
    let html = '<div class="stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>' + l.boardTitle + '</h2><p class="muted small">' + l.boardSub + ' · ' + CITIES[state.city][state.lang] + ' <bdi dir="ltr">' + state.temp + '°</bdi></p></div>' +
      '<div class="chips"><button class="chip" data-filter="all" aria-pressed="' + (state.filter === 'all') + '">' + l.all + '</button><button class="chip" data-filter="need" aria-pressed="' + (state.filter === 'need') + '">' + l.needCall + '</button></div></div>';
    html += '<div class="counts">' + ['emergency', 'red', 'amber', 'pending', 'green'].map((s) => '<div class="count st-' + s + '"><b class="num">' + (cnt[s] || 0) + '</b><span class="small">' + l.st[s] + '</span></div>').join('') + '</div>';
    html += '<div class="board-list">' + shown.map(({ p, a }) => {
      const prio = ORDER[a.status] <= 1;
      const called = state.called[p.id];
      const o = E.outlook(p, fcTemps());
      const tags = (o.preCall && ORDER[a.status] > 1 ? '<span class="pill st-amber">' + l.preTag + ' · ' + l.days[o.aheadDay] + '</span>' : '') +
        (a.mp.combo ? '<span class="pill ' + (p.comboReviewed ? 'st-green' : 'st-red') + '">' + (p.comboReviewed ? l.reviewed : l.comboTag) + '</span>' : '');
      return '<article class="card pt st-' + a.status + (prio ? ' prio' : '') + '"><div class="pt-head"><span class="pill">' + l.st[a.status] + '</span><span class="pt-name">' + esc(pname(p)) + '</span><span class="muted small">' + p.age + l.yrs + ' · ' + p.meds.map(mname).join(state.lang === 'ar' ? '، ' : ', ') + '</span>' + tags + '</div>' +
        '<div class="pt-cols"><div><div class="small muted">' + l.why2 + '</div><ul class="reasons small">' + (a.reasons.length ? a.reasons.map((r) => '<li><span class="dot"></span><span>' + reasonText(r) + '</span></li>').join('') : '<li class="muted">—</li>') + '</ul></div>' +
        '<div><div class="small muted">' + l.review + '</div><ul class="rev small">' + reviewLines(p, a).map((x) => '<li>' + x + '</li>').join('') + '</ul></div></div>' +
        '<div class="row">' + (a.status !== 'green' ? (called ? '<span class="called small">' + l.calledAt + called + '</span>' : '<button class="btn" data-call="' + p.id + '">' + l.call + '</button>') : '') +
        '<button class="btn ghost" data-open="' + p.id + '">' + l.open + '</button></div></article>';
    }).join('') + '</div></div>';
    return html;
  }

  function viewHow() {
    const ar = state.lang === 'ar';
    const rows = ar ? [
      ['وزن أقل من المعتاد بـ 1.5–3%', '2'], ['وزن أقل بـ 3% أو أكثر', '3'], ['دوخة عند الوقوف', '2'], ['هبوط الضغط عند الوقوف (≥20/10)', '2'],
      ['قيء أو إسهال', '3'], ['شرب أقل · تبول أقل · حمّى', '1 لكل منها'], ['نبض ≥ 100 وقت الراحة (من جهاز الضغط)', '2'], ['تشوش أو إغماء', 'طارئ مباشرةً']] : [
      ['Weight 1.5–3% below usual', '2'], ['Weight 3% or more below usual', '3'], ['Dizzy on standing', '2'], ['BP drop on standing (≥20/10)', '2'],
      ['Vomiting or diarrhoea', '3'], ['Drinking less · less urine · fever', '1 each'], ['Resting pulse ≥ 100 (from the BP cuff)', '2'], ['Confusion or fainting', 'Emergency at once']];
    const t = (a, b) => ar ? a : b;
    return '<div class="how">' +
      '<div class="card stack"><h2>' + t('ثلاثة مدخلات، قرار واحد', 'Three inputs, one decision') + '</h2>' +
      '<div class="tbl"><table><thead><tr><th>' + t('المدخل', 'Input') + '</th><th>' + t('النقاط', 'Points') + '</th></tr></thead><tbody>' +
      '<tr><td>' + t('الأدوية: لا شيء · متوسطة · دواءان عاليا الخطورة أو الليثيوم · تركيبة مدرّ + ACE/ARB + NSAID', 'Medicines: none · moderate · two high-risk or lithium · diuretic + ACE/ARB + NSAID') + '</td><td class="num">0 · 1 · 2 · 3</td></tr>' +
      '<tr><td>' + t('الحرارة العظمى مقارنةً بصيف المدينة نفسها (' + CITIES[state.city].ar + ': ' + E.CITY_T[state.city].join('° · ') + '°)', 'Forecast high against the city\'s own summer (' + CITIES[state.city].en + ': ' + E.CITY_T[state.city].join('° · ') + '°)') + '</td><td class="num">0 · 1 · 2 · 3</td></tr>' +
      '<tr><td>' + t('علامات الفحص اليومي (الجدول التالي)', 'Daily-check signs (next table)') + '</td><td class="num">0+</td></tr></tbody></table></div></div>' +
      '<div class="card stack"><h3>' + t('نقاط الفحص اليومي', 'Daily-check points') + '</h3><div class="tbl"><table><tbody>' + rows.map((r) => '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="card stack"><h3>' + t('قواعد اللون', 'Colour rules') + '</h3><ul class="actions">' +
      '<li class="st-red"><b style="color:var(--st-ink, var(--st))">' + t('أحمر', 'Red') + '</b>: ' + t('يوم شديد الحرارة للمدينة (أحرّ 5% من أيامها) مع دواءين عاليي الخطورة، أو مع أي دواء حساس وأي إجابة غير طبيعية؛ أو قيء أو إسهال، أو هبوط الضغط عند الوقوف، أو نبض ≥ 100، أو حمّى، أو وزن أقل بـ 3% فأكثر؛ أو علامات ≥ 4 نقاط مع دواء حساس للحرارة؛ أو تركيبة أدوية خطرة في يوم 38° فأكثر أو مع أي إجابة غير طبيعية، حتى يراجعها الصيدلي؛ أو المجموع ≥ 9. يتصل الصيدلي في اليوم نفسه.', 'a very hot day for the city (its hottest 5%) with two high-risk medicines, or with any heat-sensitive medicine and any abnormal answer; vomiting or diarrhoea, BP drop on standing, pulse ≥ 100, fever, or weight 3% or more below usual; 4 or more sign points with a heat-sensitive medicine; a dangerous mix on a day of 38° or more or with any abnormal answer, until the pharmacist has reviewed it; or total ≥ 9. The pharmacist calls the same day.') + '</li>' +
      '<li class="st-amber"><b style="color:var(--st-ink, var(--st))">' + t('أصفر', 'Amber') + '</b>: ' + t('أي إجابة غير طبيعية في الفحص اليومي، أو أدوية حساسة للحرارة في يوم 38° فأكثر (روتين الصيف)، أو تركيبة خطرة لم تُراجَع بعد، أو المجموع ≥ 5. تذكير للأسرة وفحص ثانٍ مساءً، دون اتصال من الصيدلي.', 'any abnormal answer in the daily check, heat-sensitive medicines on a day of 38° or more (summer routine), a dangerous mix not yet reviewed, or total ≥ 5. Family reminder and a second check in the evening; no pharmacist call.') + '</li>' +
      '<li class="st-emergency"><b style="color:var(--st-ink, var(--st))">' + t('طارئ', 'Emergency') + '</b>: ' + t('تشوش أو إغماء، أو قيء/إسهال مع الليثيوم. الاتصال بالإسعاف 997.', 'confusion or fainting, or vomiting/diarrhoea on lithium. Call 997.') + '</li>' +
      '<li class="st-green"><b style="color:var(--st-ink, var(--st))">' + t('أخضر', 'Green') + '</b>: ' + t('غير ذلك. نصائح الحر العامة.', 'otherwise. General heat advice.') + '</li></ul>' +
      '<p class="small muted">' + t('حدود الحرارة هي المئين 90 و95 و97.5 لدرجة الحرارة العظمى في كل مدينة (محطات الأرصاد 2021–2025)، وتُعاد معايرتها كل سنة. باقي العتبات ستُراجع مع الصيادلة قبل أي تجربة.', 'Heat cut-offs are each city\'s 90th, 95th and 97.5th percentile of daily maximum temperature (station data 2021–2025), recalibrated every year. Other thresholds will be reviewed with pharmacists before any pilot.') + '</p></div>' +
      '<div class="card stack"><h3>' + t('مبادئ السلامة', 'Safety principles') + '</h3><ul class="actions">' +
      '<li>' + t('التطبيق لا يوقف أي دواء بنفسه، والقرار للصيدلي أو الطبيب.', 'The app never stops a medicine; the pharmacist or doctor decides.') + '</li>' +
      '<li>' + t('الاقتراحات للصيدلي مأخوذة من إرشادات «أيام المرض» المنشورة.', 'Suggestions to the pharmacist follow published sick-day guidance.') + '</li>' +
      '<li>' + t('لا نعتمد على لون البول لأنه غير موثوق عند كبار السن (Hooper 2016؛ ESPEN 2019).', 'Urine colour is not used; it is unreliable in older adults (Hooper 2016; ESPEN 2019).') + '</li>' +
      '<li>' + t('التشوش أو الإغماء يتجاوز كل النقاط ويوجّه إلى الإسعاف 997.', 'Confusion or fainting overrides all scores and points to the 997 ambulance.') + '</li>' +
      '<li>' + t('توقعات الأيام الثلاثة تفتح نافذة الخطر قبل اليوم شديد الحرارة: تنبيه مسبق للأسرة، ومراجعة من الصيدلي قبله لمن يتناول أدوية عالية الخطورة.', 'The 3-day forecast opens the risk window before a very hot day: a heads-up to the family, and a pharmacist review before it for patients on high-risk medicines.') + '</li></ul></div>' +
      '</div>';
  }

  function render() {
    const l = L();
    document.documentElement.lang = state.lang; document.documentElement.dir = l.dir;
    E.setCity(state.city);
    renderTop(); renderDemo(); renderTabs();
    const v = { today: viewToday, meds: viewMeds, check: viewCheck, how: viewHow, board: viewBoard }[state.tab];
    $('view').innerHTML = v();
    $('foot').textContent = l.foot;
  }

  let toastTimer = null;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }
  const hhmm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'langBtn') { state.lang = state.lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('dhill-lang', state.lang); } catch (er) {} render(); return; }
    if (b.dataset.role) { state.role = b.dataset.role; state.tab = state.role === 'family' ? 'today' : 'board'; render(); return; }
    if (b.dataset.tab) { state.tab = b.dataset.tab; render(); return; }
    if (b.dataset.pid) { state.pid = b.dataset.pid; state.addOpen = false; render(); return; }
    if (b.dataset.go) { state.tab = b.dataset.go; render(); return; }
    if (b.dataset.rm) { const p = P(); if (p.meds.length > 1) { p.meds = p.meds.filter((m) => m !== b.dataset.rm); render(); } return; }
    if (b.id === 'replayBtn') { state.replay = !state.replay; state.userTemp = false; state.temp = baseFc()[0]; render(); return; }
    if (b.id === 'addBtn') { const s = $('addSel'); if (s && s.value) { P().meds.push(s.value); render(); } return; }
    if (b.dataset.filter) { state.filter = b.dataset.filter; render(); return; }
    if (b.dataset.call) { state.called[b.dataset.call] = hhmm(); const cp = state.patients.find((x) => x.id === b.dataset.call); if (cp && E.medProfile(cp.meds).combo) cp.comboReviewed = true; render(); return; }
    if (b.dataset.open) { state.role = 'family'; state.pid = b.dataset.open; state.tab = 'today'; render(); window.scrollTo(0, 0); return; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'citySel') { state.city = e.target.value; state.userTemp = false; E.setCity(state.city); state.temp = baseFc()[0]; render(); if (!state.live[state.city]) fetchLive(state.city); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'tempRange') {
      state.temp = +e.target.value; state.userTemp = true; $('tempOut').textContent = state.temp + '°';
      const v = { today: viewToday, meds: viewMeds, check: null, how: null, board: viewBoard }[state.tab];
      if (v) $('view').innerHTML = v();
      document.querySelectorAll('#demo [data-pid]').forEach((btn) => {
        const p = state.patients.find((x) => x.id === btn.dataset.pid); btn.className = 'chip st-' + E.assess(p, state.temp).status;
      });
    }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'checkForm') return;
    e.preventDefault();
    const n = (id) => { const v = parseFloat($(id).value); return isFinite(v) ? v : undefined; };
    const q = (k) => $('q-' + k).checked;
    const p = P();
    p.check = { weight: n('wToday') || p.baseline, dizzy: q('dizzy'), lowFluids: q('lowFluids'), lessUrine: q('lessUrine'), vomDia: q('vomDia'), fever: q('fever'), confusion: q('confusion'),
      bpLyingSys: n('bpLS'), bpLyingDia: n('bpLD'), bpStandSys: n('bpSS'), bpStandDia: n('bpSD'), pulse: n('pulse') };
    delete state.called[p.id];
    state.tab = 'today'; render(); toast(L().saved); window.scrollTo(0, 0);
  });
  render();
  fetchLive(state.city);
})();
</script>

</body>
</html>
